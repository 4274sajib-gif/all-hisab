<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#0B6B4F">

<title>All Hisab</title>

<link rel="manifest" href="manifest.json">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.95),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #edf4f1,
      #dce9e4
    );
  color:#17352d;
}

/* =========================
   LOGIN
========================= */

.login{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:390px;
  padding:34px 24px 24px;
  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.90),
      rgba(255,255,255,.62)
    );

  border:1px solid rgba(255,255,255,.85);

  box-shadow:
    0 25px 60px rgba(34,75,63,.16),
    inset 0 1px 0 rgba(255,255,255,.9);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  text-align:center;
}

.login-logo{
  width:72px;
  height:72px;
  margin:0 auto 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:23px;

  color:#fff;
  font-size:32px;
  font-weight:800;

  background:
    linear-gradient(
      145deg,
      #168b69,
      #075a43
    );

  box-shadow:
    0 14px 28px rgba(11,107,79,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.login-title{
  margin:0;
  font-size:30px;
  font-weight:800;
  letter-spacing:-.6px;
}

.login-subtitle{
  margin:8px 0 24px;
  color:#71847e;
  font-size:14px;
}

.login-field{
  position:relative;
  width:100%;
  height:54px;
  margin-top:13px;
}

.login-icon{
  position:absolute;
  left:17px;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  font-size:18px;
}

.login-field input{
  width:100%;
  height:100%;

  border:1px solid rgba(11,107,79,.12);
  border-radius:17px;

  background:rgba(255,255,255,.72);

  outline:none;

  padding:
    0 48px 0 48px;

  color:#17352d;
  font-size:15px;

  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.04);
}

.login-field input:focus{
  border-color:#0b6b4f;
  box-shadow:
    0 0 0 3px rgba(11,107,79,.08);
}

.password-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);

  width:34px;
  height:34px;

  border:0;
  background:transparent;

  cursor:pointer;
  font-size:18px;
}

.login-button{
  width:100%;
  height:54px;

  margin-top:20px;

  border:0;
  border-radius:17px;

  color:#fff;
  background:
    linear-gradient(
      145deg,
      #12906c,
      #075d45
    );

  font-size:16px;
  font-weight:800;

  box-shadow:
    0 12px 25px rgba(11,107,79,.24);

  cursor:pointer;
}

.login-button:active{
  transform:scale(.98);
}

.login-error{
  display:none;
  margin-top:12px;
  color:#d64e4e;
  font-size:13px;
  font-weight:600;
}

.login-error.show{
  display:block;
}

.login-footer{
  margin-top:24px;
  color:#91a19c;
  font-size:12px;
  font-weight:600;
}

/* =========================
   HOME
========================= */

.home{
  width:100%;
  height:100%;
  padding:
    24px
    20px
    20px;

  overflow:auto;
}

.top{
  width:100%;
  max-width:520px;
  margin:0 auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:54px;
  height:54px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  color:#fff;
  font-size:24px;
  font-weight:800;

  background:
    linear-gradient(
      145deg,
      #168b69,
      #075a43
    );

  box-shadow:
    0 12px 25px rgba(11,107,79,.22),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.title h1{
  margin:0;

  font-size:27px;
  font-weight:850;
  letter-spacing:-.5px;
}

.title p{
  margin:4px 0 0;

  color:#71847e;
  font-size:13px;
}

/* =========================
   APP CARDS
========================= */

.apps{
  width:100%;
  max-width:500px;

  margin:
    58px
    auto
    0;

  display:flex;
  flex-direction:column;
  gap:19px;
}

.app-card{
  width:100%;
  min-height:105px;

  display:flex;
  align-items:center;

  padding:18px;

  border:1px solid rgba(255,255,255,.8);
  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.92),
      rgba(255,255,255,.62)
    );

  box-shadow:
    0 18px 35px rgba(43,80,70,.12),
    inset 0 1px 0 rgba(255,255,255,.85);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  cursor:pointer;
  text-align:left;

  transition:
    transform .18s,
    box-shadow .18s;
}

.app-card:active{
  transform:
    translateY(2px)
    scale(.985);

  box-shadow:
    0 10px 20px rgba(43,80,70,.12);
}

.icon-wrap{
  width:66px;
  height:66px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:21px;

  box-shadow:
    0 10px 20px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.35);
}

.icon-wrap.hisab{
  background:
    linear-gradient(
      145deg,
      #168b69,
      #075d45
    );
}

.icon-wrap.khoroch{
  background:
    linear-gradient(
      145deg,
      #d5a94c,
      #9d7120
    );
}

.icon{
  font-size:30px;
}

.details{
  min-width:0;
  flex:1;

  padding-left:16px;
}

.details h2{
  margin:0;

  font-size:18px;
  font-weight:800;

  color:#183a31;
}

.details p{
  margin:5px 0 0;

  font-size:13px;
  color:#81918c;
}

.arrow{
  flex:none;

  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(11,107,79,.08);

  color:#0b6b4f;

  font-size:28px;
  font-weight:300;
}

/* =========================
   HOME LOGOUT
========================= */

.home-logout{
  display:block;

  width:100%;
  max-width:500px;

  margin:
    70px
    auto
    0;
}

/* =========================
   LOGOUT BUTTON
========================= */

.logout-btn{
  height:50px;

  border:1px solid rgba(255,255,255,.65);
  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      rgba(255,125,125,.86),
      rgba(224,91,105,.82)
    );

  color:#fff;

  font-size:14px;
  font-weight:800;

  box-shadow:
    0 10px 22px rgba(190,70,80,.17),
    inset 0 1px 0 rgba(255,255,255,.35);

  cursor:pointer;
}

/* =========================
   FOOTER
========================= */

.footer{
  width:100%;
  max-width:500px;

  margin:
    24px
    auto
    20px;

  text-align:center;

  color:#91a19c;
  font-size:12px;
  font-weight:600;
}

/* =========================
   VIEWER
========================= */

.viewer{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  background:#fff;

  display:none;

  z-index:10;
}

.viewer iframe{
  width:100%;
  height:100%;

  border:0;

  display:block;
}

/* =========================
   EDGE SWITCHER
========================= */

.edge-switcher{
  position:fixed;

  left:-8px;
  bottom:12px;

  z-index:40;

  width:42px;
  height:42px;

  border:1px solid rgba(255,255,255,.55);
  border-left:0;

  border-radius:
    0
    18px
    18px
    0;

  background:
    linear-gradient(
      145deg,
      rgba(198,155,164,.78),
      rgba(224,190,198,.72)
    );

  box-shadow:
    4px 6px 18px rgba(130,90,100,.14),
    inset 0 1px 0 rgba(255,255,255,.55);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  transition:
    width .18s,
    transform .18s,
    box-shadow .18s;
}

.edge-switcher::before{
  content:"⇄";

  color:#fff;

  font-size:20px;
  font-weight:700;
  line-height:1;

  text-shadow:
    0 1px 3px rgba(90,60,70,.18);
}

.edge-switcher:active{
  width:48px;

  transform:scale(.96);

  box-shadow:
    3px 4px 12px rgba(130,90,100,.16),
    inset 0 1px 0 rgba(255,255,255,.45);
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:fixed;
  inset:0;

  z-index:50;

  background:
    rgba(20,35,31,.30);

  opacity:0;
  pointer-events:none;

  transition:opacity .2s;

  display:flex;
  align-items:flex-end;

  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* =========================
   BOTTOM SHEET
========================= */

.sheet{
  width:100%;

  padding:
    10px
    18px
    22px;

  border-radius:
    28px
    28px
    0
    0;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.97),
      rgba(242,248,245,.96)
    );

  box-shadow:
    0 -15px 45px rgba(20,60,48,.18);

  transform:translateY(100%);

  transition:
    transform .25s ease;
}

.overlay.show .sheet{
  transform:translateY(0);
}

.handle{
  width:42px;
  height:5px;

  margin:
    2px
    auto
    18px;

  border-radius:20px;

  background:#d1dcd8;
}

.sheet-title{
  margin-bottom:14px;

  font-size:17px;
  font-weight:800;

  color:#193a31;

  text-align:center;
}

.sheet-app{
  width:100%;
  min-height:70px;

  display:flex;
  align-items:center;

  padding:12px;

  margin-top:10px;

  border:1px solid rgba(11,107,79,.08);
  border-radius:19px;

  background:
    rgba(255,255,255,.74);

  cursor:pointer;

  text-align:left;

  transition:
    transform .15s,
    background .15s;
}

.sheet-app:active{
  transform:scale(.985);
}

.sheet-app.active{
  background:
    rgba(11,107,79,.08);

  border-color:
    rgba(11,107,79,.18);
}

.sheet-icon{
  width:48px;
  height:48px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:16px;

  font-size:23px;

  color:#fff;
}

.sheet-icon.hisab{
  background:
    linear-gradient(
      145deg,
      #168b69,
      #075d45
    );
}

.sheet-icon.khoroch{
  background:
    linear-gradient(
      145deg,
      #d5a94c,
      #9d7120
    );
}

.sheet-info{
  flex:1;
  min-width:0;

  padding-left:13px;
}

.sheet-info strong{
  display:block;

  color:#193a31;

  font-size:15px;
}

.sheet-info span{
  display:block;

  margin-top:3px;

  color:#84938e;

  font-size:12px;
}

.check{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#0b6b4f;

  color:#fff;

  font-size:16px;
  font-weight:800;

  opacity:0;
}

.sheet-app.active .check{
  opacity:1;
}

.home-btn{
  width:100%;
  height:50px;

  margin-top:15px;

  border:1px solid rgba(11,107,79,.10);
  border-radius:17px;

  background:
    rgba(11,107,79,.07);

  color:#0b6b4f;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}

.sheet > .logout-btn{
  width:100%;

  margin-top:10px;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:650px){

  .home{
    padding-top:16px;
  }

  .apps{
    margin-top:32px;
    gap:13px;
  }

  .app-card{
    min-height:90px;
    padding:14px;
  }

  .icon-wrap{
    width:55px;
    height:55px;
    border-radius:18px;
  }

  .icon{
    font-size:25px;
  }

  .home-logout{
    margin-top:35px;
  }

  .footer{
    margin-top:18px;
  }
}

</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login" id="login">

  <div class="login-card">

    <div class="login-logo">
      ▣
    </div>

    <h1 class="login-title">

    </h1>

    <p class="login-subtitle">
      সফটওয়্যার ব্যবহার করতে Login করুন

    <div class="login-field">

     HOME PAGE
========================= -->

  id="home"
  style="display:none;"
>

>

<!-- =========================

  id="overlay"
  onclick="closeSheet(event)"
>

    onclick="event.stopPropagation()"
  >

      id="sheetHisab"
      onclick="openApp('hisab')"
    >

      </div>

      <div class="sheet-info">

        <strong>
          আমার হিসাব
        </strong>

          হিসাব ব্যবস্থাপনা

        id="checkHisab"

        </strong>

          দৈনিক খরচের হিসাব

      onclick="logout()"
    >
      🚪 Logout
    </button>

  </div>

</div>


<script>

/* =========================
   LOGIN SETTINGS
========================= */

const LOGIN_USERNAME = "Sajib71";
const LOGIN_PASSWORD = "Babu78784";


/* =========================
   APP URLS
========================= */

const apps = {

  hisab:
    "https://4274sajib-gif.github.io/amar-hisab/",

  khoroch:
    "https://4274sajib-gif.github.io/my-expense/"

};


let currentApp = "";

const LOGIN_KEY =
  "AMAR_APP_LOGIN";


/* =========================
   LOGIN CHECK
========================= */

function checkLogin(){

  const loggedIn =
    localStorage.getItem(
      LOGIN_KEY
    );

  if(
    loggedIn === "true"
  ){

    showHome();

  }else{

    showLogin();

  }

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document.getElementById(
    "login"
  ).style.display = "flex";

  document.getElementById(
    "home"
  ).style.display = "none";

  document.getElementById(
    "viewer"
  ).style.display = "none";

  document.getElementById(
    "appFrame"
  ).src = "";

}


/* =========================
   SHOW HOME
========================= */

function showHome(){

  document.getElementById(
    "login"
  ).style.display = "none";

  document.getElementById(
    "home"
  ).style.display = "block";

  document.getElementById(
    "viewer"
  ).style.display = "none";

}


/* =========================
   LOGIN
========================= */

function login(){

  const username =
    document.getElementById(
      "loginUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const error =
    document.getElementById(
      "loginError"
    );


  if(
    username === LOGIN_USERNAME &&
    password === LOGIN_PASSWORD
  ){

    localStorage.setItem(
      LOGIN_KEY,
      "true"
    );

    error.classList.remove(
      "show"
    );

    document.getElementById(
      "loginPassword"
    ).value = "";

    showHome();

  }else{

    error.classList.add(
      "show"
    );

  }

}


/* =========================
   PASSWORD TOGGLE
========================= */

function togglePassword(){

  const input =
    document.getElementById(
      "loginPassword"
    );

  const button =
    document.querySelector(
      ".password-toggle"
    );


  if(
    input.type === "password"
  ){

    input.type = "text";

    button.textContent = "🙈";

  }else{

    input.type = "password";

    button.textContent = "👁";

  }

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById(
    "loginUsername"
  )
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        document
          .getElementById(
            "loginPassword"
          )
          .focus();

      }

    }
  );


document
  .getElementById(
    "loginPassword"
  )
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        login();

      }

    }
  );


/* =========================
   OPEN APP
========================= */

function openApp(name){

  currentApp =
    name;

  document.getElementById(
    "home"
  ).style.display = "none";

  document.getElementById(
    "viewer"
  ).style.display = "block";

  document.getElementById(
    "appFrame"
  ).src =
    apps[name];

  updateSwitcher();

  closeSheet();

}


/* =========================
   UPDATE SWITCHER
========================= */

function updateSwitcher(){

  const h =
    document.getElementById(
      "sheetHisab"
    );

  const k =
    document.getElementById(
      "sheetKhoroch"
    );

  const ch =
    document.getElementById(
      "checkHisab"
    );

  const ck =
    document.getElementById(
      "checkKhoroch"
    );


  h.classList.toggle(
    "active",
    currentApp === "hisab"
  );

  k.classList.toggle(
    "active",
    currentApp === "khoroch"
  );


  ch.textContent =
    currentApp === "hisab"
      ? "✓"
      : "";


  ck.textContent =
    currentApp === "khoroch"
      ? "✓"
      : "";

}


/* =========================
   OPEN SHEET
========================= */

function openSheet(){

  updateSwitcher();

  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );

}


/* =========================
   CLOSE SHEET
========================= */

function closeSheet(e){

  if(
    e &&
    e.target !==
    document.getElementById(
      "overlay"
    )
  ){

    return;

  }

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

}


/* =========================
   GO HOME
========================= */

function goHome(){

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "appFrame"
    )
    .src = "";


  document
    .getElementById(
      "viewer"
    )
    .style.display = "none";


  document
    .getElementById(
      "home"
    )
    .style.display = "block";


  currentApp = "";

}


/* =========================
   LOGOUT
========================= */

function logout(){

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "appFrame"
    )
    .src = "";


  document
    .getElementById(
      "viewer"
    )
    .style.display = "none";


  currentApp = "";


  localStorage.removeItem(
    LOGIN_KEY
  );


  document
    .getElementById(
      "loginUsername"
    )
    .value = "";


  document
    .getElementById(
      "loginPassword"
    )
    .value = "";


  document
    .getElementById(
      "loginError"
    )
    .classList.remove(
      "show"
    );


  showLogin();

}


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register("sw.js")
        .catch(() => {});

    }
  );

}


/* =========================
   START
========================= */

checkLogin();
