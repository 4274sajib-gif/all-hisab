/* =========================
   APP CARDS (3D)
========================= */

.apps{
  width:100%;
  max-width:500px;

  margin:
    250px
    auto
    0;

  display:flex;
  flex-direction:column;
  gap:22px;

  perspective:1000px;
  position:relative;
  z-index:1;
}

.app-card{
  position:relative;
  width:100%;
  min-height:110px;

  display:flex;
  align-items:center;

  padding:20px;

  border:1px solid rgba(255,255,255,.9);
  border-radius:26px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(255,255,255,.72)
    );

  box-shadow:
    0 1px 0 rgba(255,255,255,1) inset,
    0 -1px 0 rgba(0,0,0,.03) inset,
    0 12px 24px -8px rgba(30,70,58,.18),
    0 30px 50px -20px rgba(30,70,58,.35),
    0 20px 40px -22px rgba(11,107,79,.28);

  cursor:pointer;
  text-align:left;
  overflow:hidden;

  transform:translateZ(0) rotateX(0deg);
  transform-style:preserve-3d;

  animation:
    cardEntrance .8s cubic-bezier(.2,.9,.3,1) both,
    cardFloat 4s ease-in-out infinite;

  transition:
    transform .35s cubic-bezier(.2,.9,.3,1),
    box-shadow .35s ease;
}

.app-card:nth-child(1){ animation-delay:.05s, .9s; }
.app-card:nth-child(2){ animation-delay:.18s, 1.4s; }
.app-card:nth-child(3){ animation-delay:.31s, 1.9s; }

@keyframes cardEntrance{
  0%{
    opacity:0;
    transform:translateY(40px) rotateX(-20deg) scale(.9);
  }
  100%{
    opacity:1;
    transform:translateY(0) rotateX(0deg) scale(1);
  }
}

@keyframes cardFloat{
  0%,100%{ transform:translateY(0) rotateX(0deg); }
  50%    { transform:translateY(-5px) rotateX(2deg); }
}

.app-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:55%;

  border-radius:26px 26px 60% 60%/26px 26px 40px 40px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.7) 0%,
      rgba(255,255,255,0) 100%
    );

  pointer-events:none;
  z-index:1;
}

.app-card::after{
  content:"";
  position:absolute;
  left:0;
  top:20%;
  bottom:20%;
  width:5px;
  border-radius:0 6px 6px 0;

  background:
    linear-gradient(
      180deg,
      #168b69,
      #075a43
    );

  opacity:0;
  transform:scaleY(.4);
  transform-origin:center;

  transition:opacity .35s ease, transform .35s ease;

  pointer-events:none;
  z-index:2;
}

.app-card:nth-child(2)::after{
  background:linear-gradient(180deg,#d5a94c,#9d7120);
}

.app-card:nth-child(3)::after{
  background:linear-gradient(180deg,#5689d8,#3156a1);
}

.app-card:active{
  transform:translateY(2px) scale(.975) rotateX(0deg);

  box-shadow:
    0 1px 0 rgba(255,255,255,1) inset,
    0 -1px 0 rgba(0,0,0,.03) inset,
    0 6px 14px -6px rgba(30,70,58,.22),
    0 14px 26px -14px rgba(30,70,58,.35),
    0 10px 22px -14px rgba(11,107,79,.35);
}

.app-card:active::after{
  opacity:1;
  transform:scaleY(1);
}

.icon-wrap{
  position:relative;
  width:70px;
  height:70px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -3px 0 rgba(0,0,0,.12) inset,
    0 10px 18px -6px rgba(0,0,0,.28),
    0 16px 26px -14px rgba(0,0,0,.35);

  transform:translateZ(30px);

  transition:transform .35s cubic-bezier(.2,.9,.3,1);
}

.app-card:active .icon-wrap{
  transform:translateZ(30px) scale(.94) rotate(-4deg);
}

.icon-wrap::before{
  content:"";
  position:absolute;
  top:6%;
  left:10%;
  right:10%;
  height:40%;
  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.55),
      rgba(255,255,255,0)

.arrow{

  display:flex;
  align-items:center;

  background:
    linear-gradient(

  transform:translateZ(20px);

    background .3s,
    transform .35s cubic-bezier(.2,.9,.3,1);

    linear-gradient(

/* =========================
   ★★★ EDGE SWITCHER (3D) ★★★
   Same position: left edge, bottom area
========================= */

.edge-switcher{
  position:fixed;

  left:-8px;
  bottom:12px;

  z-index:40;

  width:46px;
  height:48px;

  border:0;
  border-left:0;

  border-radius:
    0
    20px
    20px
    0;

  /* 3D base gradient (glossy top → dark bottom) */
  background:
    linear-gradient(
      180deg,
      #22d3a0 0%,
      #168b69 35%,
      #0b6b4f 70%,
      #054a37 100%
    );

  /* Multiple layered shadows for real 3D depth */
  box-shadow:
    /* Top highlight */
    0 1px 0 rgba(255,255,255,.75) inset,
    /* Left inner light */
    1px 0 0 rgba(255,255,255,.35) inset,
    /* Bottom inner dark (bevel) */
    0 -4px 6px rgba(0,0,0,.35) inset,
    /* Right inner dark (bevel) */
    -2px 0 4px rgba(0,0,0,.2) inset,
    /* Close cast shadow */
    3px 4px 8px rgba(11,107,79,.35),
    /* Mid cast shadow */
    6px 10px 20px rgba(11,107,79,.28),
    /* Deep cast shadow (3D lift) */
    10px 18px 34px -8px rgba(11,107,79,.45);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  overflow:hidden;

  /* 3D perspective + tilt */
  transform:
    perspective(500px)
    rotateY(-10deg)
    translateZ(0);

  transform-origin:left center;

  transition:
    width .3s cubic-bezier(.2,.9,.3,1),
    transform .3s cubic-bezier(.2,.9,.3,1),
    box-shadow .3s ease,
    border-radius .3s ease;

  /* Pulse glow animation */
  animation:edgePulse3D 3.2s ease-in-out infinite;
}

/* Pulse glow (glows brighter/dimmer) */
@keyframes edgePulse3D{
  0%,100%{
    box-shadow:
      0 1px 0 rgba(255,255,255,.75) inset,
      1px 0 0 rgba(255,255,255,.35) inset,
      0 -4px 6px rgba(0,0,0,.35) inset,
      -2px 0 4px rgba(0,0,0,.2) inset,
      3px 4px 8px rgba(11,107,79,.35),
      6px 10px 20px rgba(11,107,79,.28),
      10px 18px 34px -8px rgba(11,107,79,.45),
      0 0 12px rgba(34,211,160,.35);
  }
  50%{
    box-shadow:
      0 1px 0 rgba(255,255,255,.85) inset,
      1px 0 0 rgba(255,255,255,.45) inset,
      0 -4px 6px rgba(0,0,0,.4) inset,
      -2px 0 4px rgba(0,0,0,.25) inset,
      3px 4px 10px rgba(11,107,79,.45),
      6px 10px 24px rgba(11,107,79,.4),
      10px 20px 40px -8px rgba(11,107,79,.6),
      0 0 26px rgba(34,211,160,.7);
  }
}

/* Glossy top highlight (glass shine) */
.edge-switcher::before{
  content:"⇄";

  color:#fff;

  font-size:20px;
  font-weight:800;
  line-height:1;

  position:relative;
  z-index:3;

  text-shadow:
    0 1px 0 rgba(255,255,255,.4),
    0 2px 6px rgba(0,0,0,.5),
    0 0 12px rgba(34,211,160,.5);

  animation:arrowGlow 2.4s ease-in-out infinite;
}

@keyframes arrowGlow{
  0%,100%{
    transform:translateX(0);
    text-shadow:
      0 1px 0 rgba(255,255,255,.4),
      0 2px 6px rgba(0,0,0,.5),
      0 0 10px rgba(34,211,160,.4);
  }
  50%{
    transform:translateX(-2px);
    text-shadow:
      0 1px 0 rgba(255,255,255,.6),
      0 2px 8px rgba(0,0,0,.6),
      0 0 22px rgba(34,211,160,.95);
  }
}

/* Light sweep shine across the button */
.edge-switcher::after{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;

  background:
    linear-gradient(
      100deg,
      transparent 0%,
      rgba(255,255,255,.75) 50%,
      transparent 100%
    );

  transform:skewX(-20deg);

  animation:shine3D 3.4s ease-in-out infinite;

  pointer-events:none;
  z-index:2;
}

@keyframes shine3D{
  0%   { left:-120%; }
  55%  { left:150%; }
  100% { left:150%; }
}

/* Vertical glossy stripe on left edge (adds 3D bevel look) */
.edge-switcher .gloss{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:6px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.65) 0%,
      rgba(255,255,255,.15) 60%,
      transparent 100%
    );

  border-radius:
    0
    20px
    20px
    0;

  pointer-events:none;
  z-index:2;
}

/* Pulse ring (3D expanding ring) */
.edge-switcher .pulse-ring{
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);

  width:100%;
  height:100%;

  border-radius:inherit;

  border:2px solid rgba(34,211,160,.9);

  animation:ringPulse3D 2.6s ease-out infinite;

  pointer-events:none;
  z-index:1;
}

@keyframes ringPulse3D{
  0%{
    opacity:1;
    transform:translateY(-50%) scale(1);
    box-shadow:0 0 12px rgba(34,211,160,.9);
  }
  100%{
    opacity:0;
    transform:translateY(-50%) scale(2);
    box-shadow:0 0 0 rgba(34,211,160,0);
  }
}

/* Active / pressed-down state (button sinks into surface) */
.edge-switcher:active{
  width:56px;

  border-radius:
    0
    24px
    24px
    0;

  transform:
    perspective(500px)
    rotateY(-4deg)
    translateX(2px)
    scale(.96);

  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    1px 0 0 rgba(255,255,255,.2) inset,
    0 -2px 4px rgba(0,0,0,.5) inset,
    -1px 0 3px rgba(0,0,0,.3) inset,
    2px 2px 6px rgba(11,107,79,.4),
    3px 4px 12px rgba(11,107,79,.35),
    5px 8px 20px -6px rgba(11,107,79,.5),
    0 0 40px rgba(34,211,160,.9);
}

.sheet-icon.family{
  background:
    linear-gradient(
      145deg,
      #5689d8,
      #3156a1
    );
}

.sheet-info{
  flex:1;
  min-width:0;

  padding-left:13px;
}

.sheet-info strong{
  display:block;

  color:#193a31;

  font-size:15px;
}

.sheet-info span{
  display:block;

  margin-top:3px;

  color:#84938e;

  font-size:12px;
}

.check{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#0b6b4f;

  color:#fff;

  font-size:16px;
  font-weight:800;

  opacity:0;
}

.sheet-app.active .check{
  opacity:1;
}

.home-btn{
  width:100%;
  height:50px;

  margin-top:15px;

  border:1px solid rgba(11,107,79,.10);
  border-radius:17px;

  background:
    rgba(11,107,79,.07);

  color:#0b6b4f;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}

.sheet > .logout-btn{
  width:100%;

  margin-top:10px;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:650px){

  .home{
    padding-top:16px;
  }

  .apps{
    margin-top:180px;
    gap:13px;
  }

  .app-card{
    min-height:90px;
    padding:14px;
  }

  .icon-wrap{
    width:55px;
    height:55px;
    border-radius:18px;
  }

  .icon{
    font-size:25px;
  }

  .home-logout{
    margin-top:35px;
  }

  .footer{
    margin-top:18px;
  }
}

</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login" id="login">

  <div class="login-card">

    <div class="login-logo">
      ▣
    </div>

    <h1 class="login-title">
      All Hisab
    </h1>

    <p class="login-subtitle">
      সফটওয়্যার ব্যবহার করতে Login করুন
    </p>

    <div class="login-field">

      <span class="login-icon">
        👤
      </span>

      <input
        id="loginUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
      >

    </div>

    <div class="login-field">

      <span class="login-icon">
        🔑
      </span>

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="password-toggle"
        type="button"
        onclick="togglePassword()"
        aria-label="Password দেখুন"
      >
        👁
      </button>

    </div>

    <button
      class="login-button"
      type="button"
      onclick="login()"
    >
      Login
    </button>

    <div
      class="login-error"
      id="loginError"
    >
      Username অথবা Password ভুল
    </div>

    <div class="login-footer">
      All Hisab
    </div>

  </div>

</div>


<!-- =========================
     HOME PAGE
========================= -->

<div
  class="home"
  id="home"
  style="display:none;"
>

  <div class="top">

    <div class="brand">

      <div class="logo">
        ▣
      </div>

      <div class="title">

        <h1>
          All Hisab
        </h1>

        <p>
          আপনার প্রয়োজনীয় সফটওয়্যার এক জায়গায়
        </p>

      </div>

    </div>

  </div>


  <div class="apps">

    <!-- AMAR HISAB -->
    <button
      class="app-card"
      onclick="openApp('hisab')"
    >

      <div class="icon-wrap hisab">
        <span class="icon">
          📊
        </span>
      </div>

      <div class="details">

        <h2>
          আমার হিসাব
        </h2>

        <p>
          হিসাব ব্যবস্থাপনা
        </p>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- AMAR KHOROCH -->
    <button
      class="app-card"
      onclick="openApp('khoroch')"
    >

      <div class="icon-wrap khoroch">
        <span class="icon">
          💰
        </span>
      </div>

      <div class="details">

        <h2>
          আমার খরচ
        </h2>

        <p>
          দৈনিক খরচের হিসাব
        </p>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- FAMILY MAINTENANCE -->
    <button
      class="app-card"
      onclick="openApp('family')"
    >

      <div class="icon-wrap family">
        <span class="icon">
          👨‍👩‍👧
        </span>
      </div>

      <div class="details">

        <h2>
          Family Maintenance
        </h2>

        <p>
          পরিবারের হিসাব ব্যবস্থাপনা
        </p>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>

  </div>


  <button
    class="logout-btn home-logout"
    onclick="logout()"
  >
    🚪 Logout
  </button>


  <div class="footer">
    All Hisab
  </div>

</div>


<!-- =========================
     SOFTWARE VIEWER
========================= -->

<div
  class="viewer"
  id="viewer"
>

  <iframe
    id="appFrame"
  ></iframe>

  <!-- ★ 3D EDGE SWITCHER (same position) ★ -->
  <div
    class="edge-switcher"
    onclick="openSheet()"
    aria-label="Switch App"
  >
    <div class="gloss"></div>
    <div class="pulse-ring"></div>
  </div>

</div>


<!-- =========================
     APP SWITCHER
========================= -->

<div
  class="overlay"
  id="overlay"
  onclick="closeSheet(event)"
>

  <div
    class="sheet"
    onclick="event.stopPropagation()"
  >

    <div class="handle"></div>

    <div class="sheet-title">
      অ্যাপ পরিবর্তন করুন
    </div>


    <!-- HISAB -->
    <button
      class="sheet-app"
      id="sheetHisab"
      onclick="openApp('hisab')"
    >

      <div class="sheet-icon hisab">
        📊
      </div>

      <div class="sheet-info">

        <strong>
          আমার হিসাব
        </strong>

        <span>
          হিসাব ব্যবস্থাপনা
        </span>

      </div>

      <div
        class="check"
        id="checkHisab"
      ></div>

    </button>


    <!-- KHOROCH -->
    <button
      class="sheet-app"
      id="sheetKhoroch"
      onclick="openApp('khoroch')"
    >

      <div class="sheet-icon khoroch">
        💰
      </div>

      <div class="sheet-info">

        <strong>
          আমার খরচ
        </strong>

        <span>
          দৈনিক খরচের হিসাব
        </span>

      </div>

      <div
        class="check"
        id="checkKhoroch"
      ></div>

    </button>


    <!-- FAMILY -->
    <button
      class="sheet-app"
      id="sheetFamily"
      onclick="openApp('family')"
    >

      <div class="sheet-icon family">
        👨‍👩‍👧
      </div>

      <div class="sheet-info">

        <strong>
          Family Maintenance
        </strong>

        <span>
          পরিবারের হিসাব ব্যবস্থাপনা
        </span>

      </div>

      <div
        class="check"
        id="checkFamily"
      ></div>

    </button>


    <!-- HOME -->
    <button
      class="home-btn"
      onclick="goHome()"
    >
      🏠 মূল পেজ
    </button>


    <!-- LOGOUT -->
    <button
      class="logout-btn"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </div>

</div>


<script>

/* =========================
   LOGIN SETTINGS
========================= */

const LOGIN_USERNAME = "Sajib71";
const LOGIN_PASSWORD = "Babu78784";


/* =========================
   APP URLS
========================= */

const apps = {

  hisab:
    "https://4274sajib-gif.github.io/amar-hisab/",

  khoroch:
    "https://4274sajib-gif.github.io/my-expense/",

  family:
    "https://4274sajib-gif.github.io/family/"

};


let currentApp = "";

const LOGIN_KEY =
  "AMAR_APP_LOGIN";


/* =========================
   LOGIN CHECK
========================= */

function checkLogin(){

  const loggedIn =
    localStorage.getItem(
      LOGIN_KEY
    );

  if(
    loggedIn === "true"
  ){

    showHome();

  }else{

    showLogin();

  }

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document.getElementById(
    "login"
  ).style.display = "flex";

  document.getElementById(
    "home"
  ).style.display = "none";

  document.getElementById(
    "viewer"
  ).style.display = "none";

  document.getElementById(
    "appFrame"
  ).src = "";

}


/* =========================
   SHOW HOME
========================= */

function showHome(){

  document.getElementById(
    "login"
  ).style.display = "none";

  document.getElementById(
    "home"
  ).style.display = "block";

  document.getElementById(
    "viewer"
  ).style.display = "none";

}


/* =========================
   LOGIN
========================= */

function login(){

  const username =
    document.getElementById(
      "loginUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const error =
    document.getElementById(
      "loginError"
    );


  if(
    username === LOGIN_USERNAME &&
    password === LOGIN_PASSWORD
  ){

    localStorage.setItem(
      LOGIN_KEY,
      "true"
    );

    error.classList.remove(
      "show"
    );

    document.getElementById(
      "loginPassword"
    ).value = "";

    showHome();

  }else{

    error.classList.add(
      "show"
    );

  }

}


/* =========================
   PASSWORD TOGGLE
========================= */

function togglePassword(){

  const input =
    document.getElementById(
      "loginPassword"
    );

  const button =
    document.querySelector(
      ".password-toggle"
    );


  if(
    input.type === "password"
  ){

    input.type = "text";

    button.textContent = "🙈";

  }else{

    input.type = "password";

    button.textContent = "👁";

  }

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById(
    "loginUsername"
  )
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        document
          .getElementById(
            "loginPassword"
          )
          .focus();

      }

    }
  );


document
  .getElementById(
    "loginPassword"
  )
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        login();

      }

    }
  );


/* =========================
   OPEN APP
========================= */

function openApp(name){

  currentApp =
    name;

  document.getElementById(
    "home"
  ).style.display = "none";

  document.getElementById(
    "viewer"
  ).style.display = "block";

  document.getElementById(
    "appFrame"
  ).src =
    apps[name];

  updateSwitcher();

  closeSheet();

}


/* =========================
   UPDATE SWITCHER
========================= */

function updateSwitcher(){

  const h =
    document.getElementById(
      "sheetHisab"
    );

  const k =
    document.getElementById(
      "sheetKhoroch"
    );

  const f =
    document.getElementById(
      "sheetFamily"
    );

  const ch =
    document.getElementById(
      "checkHisab"
    );

  const ck =
    document.getElementById(
      "checkKhoroch"
    );

  const cf =
    document.getElementById(
      "checkFamily"
    );


  h.classList.toggle(
    "active",
    currentApp === "hisab"
  );

  k.classList.toggle(
    "active",
    currentApp === "khoroch"
  );

  f.classList.toggle(
    "active",
    currentApp === "family"
  );


  ch.textContent =
    currentApp === "hisab"
      ? "✓"
      : "";


  ck.textContent =
    currentApp === "khoroch"
      ? "✓"
      : "";


  cf.textContent =
    currentApp === "family"
      ? "✓"
      : "";

}


/* =========================
   OPEN SHEET
========================= */

function openSheet(){

  updateSwitcher();

  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );

}


/* =========================
   CLOSE SHEET
========================= */

function closeSheet(e){

  if(
    e &&
    e.target !==
    document.getElementById(
      "overlay"
    )
  ){

    return;

  }

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

}


/* =========================
   GO HOME
========================= */

function goHome(){

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "appFrame"
    )
    .src = "";


  document
    .getElementById(
      "viewer"
    )
    .style.display = "none";


  document
    .getElementById(
      "home"
    )
    .style.display = "block";


  currentApp = "";

}


/* =========================
   LOGOUT
========================= */

function logout(){

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "appFrame"
    )
    .src = "";


  document
    .getElementById(
      "viewer"
    )
    .style.display = "none";


  currentApp = "";


  localStorage.removeItem(
    LOGIN_KEY
  );


  document
    .getElementById(
      "loginUsername"
    )
    .value = "";


  document
    .getElementById(
      "loginPassword"
    )
    .value = "";


  document
    .getElementById(
      "loginError"
    )
    .classList.remove(
      "show"
    );


  showLogin();

}


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register("sw.js")
        .catch(() => {});

    }
  );

}


/* =========================
   START
========================= */

checkLogin();

</script>

</body>
</html>
